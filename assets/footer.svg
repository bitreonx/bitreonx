<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="104" viewBox="0 0 1200 104" role="img" aria-labelledby="title desc">
<title id="title">BitreonX status</title><desc id="desc">Terminal footer showing still compiling.</desc>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
.cursor{animation:blink 1s steps(1,end) infinite}
.bar{animation:load 4.8s cubic-bezier(.22,.8,.22,1) infinite;transform-origin:left center}
@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
@keyframes load{0%{transform:scaleX(.08);opacity:.35}45%{transform:scaleX(.82);opacity:1}70%,100%{transform:scaleX(1);opacity:.45}}
@media (prefers-reduced-motion:reduce){.cursor,.bar{animation:none}}
</style>
<rect width="1200" height="104" rx="20" fill="#070A0F"/><rect x="1" y="1" width="1198" height="102" rx="19" fill="none" stroke="#17222D"/>
<text x="44" y="55" class="mono" font-size="13" fill="#7F8B99">$ echo $STATUS</text>
<text x="211" y="55" class="mono" font-size="13" font-weight="700" fill="#72F1B8">still compiling.</text>
<rect x="350" y="43" width="8" height="15" rx="1" fill="#72F1B8" class="cursor"/>
<rect x="410" y="49" width="470" height="3" rx="2" fill="#17222D"/>
<rect x="410" y="49" width="470" height="3" rx="2" fill="#72F1B8" opacity=".55" class="bar"/>
<text x="1155" y="55" text-anchor="end" class="mono" font-size="11" fill="#637181">EOF // BITREONX</text>
</svg>